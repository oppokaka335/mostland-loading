<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>MOSTLAND</title>
	<style>
		html, body {
			margin: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #050505;
			font-family: "Segoe UI", Tahoma, Arial, Helvetica, sans-serif;
			-webkit-font-smoothing: antialiased;
		}
		::selection {
			background: #ececec;
			color: #111;
		}
		.bg {
			position: absolute;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			background: #050505 url("bg.jpg?v=3") center center no-repeat;
			background-size: 100% 100%;
		}
		.scrim {
			position: absolute;
			left: 0;
			right: 0;
			bottom: 0;
			height: 10%;
			background: linear-gradient(to top, rgba(0, 0, 0, 0.52) 0%, rgba(0, 0, 0, 0.12) 62%, rgba(0, 0, 0, 0) 100%);
			pointer-events: none;
		}
		.hud {
			position: absolute;
			left: 50%;
			bottom: 1.8%;
			width: 28%;
			min-width: 240px;
			max-width: 460px;
			-webkit-transform: translateX(-50%);
			transform: translateX(-50%);
		}
		.track-wrap {
			position: relative;
			padding: 6px;
		}
		.tick {
			position: absolute;
			width: 10px;
			height: 10px;
			border: 1px solid rgba(255, 255, 255, 0.78);
			pointer-events: none;
		}
		.tick-tl { left: 0; top: 0; border-right: 0; border-bottom: 0; }
		.tick-tr { right: 0; top: 0; border-left: 0; border-bottom: 0; }
		.tick-bl { left: 0; bottom: 0; border-right: 0; border-top: 0; }
		.tick-br { right: 0; bottom: 0; border-left: 0; border-top: 0; }
		.track {
			height: 3px;
			background: rgba(255, 255, 255, 0.12);
			overflow: hidden;
		}
		.fill {
			height: 100%;
			width: 100%;
			background: #f3f3f3;
			-webkit-transform: scaleX(0);
			transform: scaleX(0);
			-webkit-transform-origin: left center;
			transform-origin: left center;
			-webkit-transition: -webkit-transform 0.12s linear;
			transition: transform 0.12s linear;
		}
		.row {
			display: -webkit-box;
			display: -webkit-flex;
			display: flex;
			-webkit-box-pack: justify;
			-webkit-justify-content: space-between;
			justify-content: space-between;
			-webkit-box-align: baseline;
			-webkit-align-items: baseline;
			align-items: baseline;
			margin: 0 0 9px 0;
			padding: 0 2px;
			gap: 16px;
		}
		.file {
			color: #e8e8e8;
			font-size: 12px;
			letter-spacing: 0.04em;
			text-shadow: 0 1px 2px #000;
			overflow: hidden;
			white-space: nowrap;
			text-overflow: ellipsis;
			min-width: 0;
			-webkit-box-flex: 1;
			-webkit-flex: 1;
			flex: 1;
		}
		.pct {
			color: #f5f5f5;
			font-size: 13px;
			letter-spacing: 0.16em;
			font-variant-numeric: tabular-nums;
			text-shadow: 0 1px 2px #000;
			white-space: nowrap;
		}
	</style>
</head>
<body>
	<div class="bg"></div>
	<div class="scrim"></div>
	<div class="hud">
		<div class="row">
			<div class="file" id="file">Загрузка</div>
			<div class="pct" id="pct">0%</div>
		</div>
		<div class="track-wrap">
			<span class="tick tick-tl"></span>
			<span class="tick tick-tr"></span>
			<span class="tick tick-bl"></span>
			<span class="tick tick-br"></span>
			<div class="track"><div class="fill" id="fill"></div></div>
		</div>
	</div>
	<script>
		var total = 0;
		var needed = 0;
		var fill = document.getElementById("fill");
		var pct = document.getElementById("pct");
		var fileEl = document.getElementById("file");
		var statusRu = {
			"Starting Lua": "Запуск Lua",
			"Starting Lua...": "Запуск Lua",
			"Sending client info": "Отправка данных",
			"Mounting Addons": "Подключение аддонов",
			"Workshop Complete": "Мастерская готова"
		};

		function clamp(n) {
			if (n < 0) return 0;
			if (n > 100) return 100;
			return n;
		}

		function setLabel(s) {
			if (fileEl.textContent !== undefined) {
				fileEl.textContent = s;
			} else {
				fileEl.innerHTML = s;
			}
		}

		function prettyFile(raw) {
			var s = String(raw || "");
			s = s.replace(/^\s+|\s+$/g, "");
			s = s.replace(/^['"]+|['"]+$/g, "");
			s = s.replace(/^Downloading\s+/i, "");
			s = s.replace(/\s+via Workshop$/i, "");
			s = s.replace(/\s+is downloading$/i, "");
			if (s.indexOf("/") !== -1) {
				var parts = s.split("/");
				if (parts.length > 2) {
					s = parts.slice(-2).join("/");
				}
			}
			if (s.length > 52) {
				s = s.slice(0, 49) + "...";
			}
			return s;
		}

		function prettyStatus(raw) {
			var s = String(raw || "");
			s = s.replace(/^\s+|\s+$/g, "");
			if (statusRu[s]) {
				return statusRu[s];
			}
			return prettyFile(s);
		}

		function isDoneStatus(s) {
			return s.indexOf("Starting Lua") === 0 || s.indexOf("Sending client info") === 0;
		}

		function tick() {
			var p = 0;
			if (total > 0) {
				p = clamp(Math.floor(((total - needed) / total) * 100));
			}
			fill.style.webkitTransform = "scaleX(" + (p / 100) + ")";
			fill.style.transform = "scaleX(" + (p / 100) + ")";
			if (pct.textContent !== undefined) {
				pct.textContent = p + "%";
			} else {
				pct.innerHTML = p + "%";
			}
		}

		function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
			/* карту не показываем */
		}

		function SetFilesTotal(n) {
			total = parseInt(n, 10) || 0;
			tick();
		}

		function SetFilesNeeded(n) {
			needed = parseInt(n, 10) || 0;
			tick();
		}

		function DownloadingFile(fileName) {
			setLabel(prettyFile(fileName));
		}

		function SetStatusChanged(status) {
			var s = String(status || "");
			if (s) {
				setLabel(prettyStatus(s));
			}
			if (isDoneStatus(s)) {
				needed = 0;
				if (total < 1) total = 1;
				tick();
			}
		}

		window.GameDetails = GameDetails;
		window.SetFilesTotal = SetFilesTotal;
		window.SetFilesNeeded = SetFilesNeeded;
		window.DownloadingFile = DownloadingFile;
		window.SetStatusChanged = SetStatusChanged;

		if (location.hash === "#demo") {
			var demo = [
				"DarkRP",
				"SAM",
				"gProtect",
				"onehud",
				"onemenu",
				"Zero's GrowOP 2",
				"Bitminers 2",
				"Zero's BotNet",
				"cSlot: Bank Breaker",
				"Winemaking System"
			];
			total = demo.length;
			needed = demo.length;
			tick();
			var di = 0;
			var t = setInterval(function () {
				if (di >= demo.length) {
					SetStatusChanged("Starting Lua...");
					clearInterval(t);
					return;
				}
				DownloadingFile(demo[di]);
				needed = Math.max(0, needed - 1);
				tick();
				di = di + 1;
			}, 220);
		}
	</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>MOSTLAND</title>
	<style>
		html, body {
			margin: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #050505;
			font-family: "Segoe UI", Tahoma, Arial, Helvetica, sans-serif;
			-webkit-font-smoothing: antialiased;
		}
		::selection {
			background: #ececec;
			color: #111;
		}
		.bg {
			position: absolute;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			background: #050505 url("bg.jpg") center center no-repeat;
			background-size: 100% 100%;
		}
		.scrim {
			position: absolute;
			left: 0;
			right: 0;
			bottom: 0;
			height: 22%;
			background: linear-gradient(to top, rgba(0, 0, 0, 0.52) 0%, rgba(0, 0, 0, 0.12) 62%, rgba(0, 0, 0, 0) 100%);
			pointer-events: none;
		}
		.hud {
			position: absolute;
			left: 50%;
			bottom: 8.5%;
			width: 42%;
			min-width: 280px;
			max-width: 620px;
			-webkit-transform: translateX(-50%);
			transform: translateX(-50%);
		}
		.track-wrap {
			position: relative;
			padding: 6px;
		}
		.tick {
			position: absolute;
			width: 10px;
			height: 10px;
			border: 1px solid rgba(255, 255, 255, 0.78);
			pointer-events: none;
		}
		.tick-tl { left: 0; top: 0; border-right: 0; border-bottom: 0; }
		.tick-tr { right: 0; top: 0; border-left: 0; border-bottom: 0; }
		.tick-bl { left: 0; bottom: 0; border-right: 0; border-top: 0; }
		.tick-br { right: 0; bottom: 0; border-left: 0; border-top: 0; }
		.track {
			height: 3px;
			background: rgba(255, 255, 255, 0.12);
			overflow: hidden;
		}
		.fill {
			height: 100%;
			width: 100%;
			background: #f3f3f3;
			-webkit-transform: scaleX(0);
			transform: scaleX(0);
			-webkit-transform-origin: left center;
			transform-origin: left center;
			-webkit-transition: -webkit-transform 0.12s linear;
			transition: transform 0.12s linear;
		}
		.row {
			display: -webkit-box;
			display: -webkit-flex;
			display: flex;
			-webkit-box-pack: justify;
			-webkit-justify-content: space-between;
			justify-content: space-between;
			-webkit-box-align: baseline;
			-webkit-align-items: baseline;
			align-items: baseline;
			margin-top: 11px;
			padding: 0 2px;
			gap: 16px;
		}
		.file {
			color: #e8e8e8;
			font-size: 12px;
			letter-spacing: 0.04em;
			text-shadow: 0 1px 2px #000;
			overflow: hidden;
			white-space: nowrap;
			text-overflow: ellipsis;
			min-width: 0;
			-webkit-box-flex: 1;
			-webkit-flex: 1;
			flex: 1;
		}
		.pct {
			color: #f5f5f5;
			font-size: 13px;
			letter-spacing: 0.16em;
			font-variant-numeric: tabular-nums;
			text-shadow: 0 1px 2px #000;
			white-space: nowrap;
		}
	</style>
</head>
<body>
	<div class="bg"></div>
	<div class="scrim"></div>
	<div class="hud">
		<div class="track-wrap">
			<span class="tick tick-tl"></span>
			<span class="tick tick-tr"></span>
			<span class="tick tick-bl"></span>
			<span class="tick tick-br"></span>
			<div class="track"><div class="fill" id="fill"></div></div>
		</div>
		<div class="row">
			<div class="file" id="file"></div>
			<div class="pct" id="pct">0%</div>
		</div>
	</div>
	<script>
		var total = 0;
		var needed = 0;
		var fill = document.getElementById("fill");
		var pct = document.getElementById("pct");
		var fileEl = document.getElementById("file");

		function clamp(n) {
			if (n < 0) return 0;
			if (n > 100) return 100;
			return n;
		}

		function tick() {
			var p = 0;
			if (total > 0) {
				p = clamp(Math.floor(((total - needed) / total) * 100));
			}
			fill.style.webkitTransform = "scaleX(" + (p / 100) + ")";
			fill.style.transform = "scaleX(" + (p / 100) + ")";
			pct.innerHTML = p + "%";
		}

		function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
			/* карту не показываем */
		}

		function SetFilesTotal(n) {
			total = parseInt(n, 10) || 0;
			tick();
		}

		function SetFilesNeeded(n) {
			needed = parseInt(n, 10) || 0;
			tick();
		}

		function DownloadingFile(name) {
			var s = String(name || "");
			if (s.length > 64) {
				s = s.slice(0, 61) + "...";
			}
			fileEl.innerHTML = s;
		}

		function SetStatusChanged(status) {
			var s = String(status || "");
			if (s && !fileEl.innerHTML) {
				fileEl.innerHTML = s;
			}
			if (s === "Sending client info" || s === "Starting Lua") {
				needed = 0;
				if (total < 1) total = 1;
				tick();
			}
		}

		window.GameDetails = GameDetails;
		window.SetFilesTotal = SetFilesTotal;
		window.SetFilesNeeded = SetFilesNeeded;
		window.DownloadingFile = DownloadingFile;
		window.SetStatusChanged = SetStatusChanged;

		if (location.hash === "#demo") {
			total = 80;
			needed = 80;
			tick();
			var t = setInterval(function () {
				needed = needed - 2;
				if (needed < 0) needed = 0;
				DownloadingFile("addon_" + (total - needed) + ".gma");
				tick();
				if (needed <= 0) clearInterval(t);
			}, 90);
		}
	</script>
</body>
</html>

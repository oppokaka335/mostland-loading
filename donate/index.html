<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="referrer" content="no-referrer">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src https://widget.donatepay.eu https://donatepay.eu; child-src https://widget.donatepay.eu https://donatepay.eu; base-uri 'none'; form-action https://donatepay.eu https://widget.donatepay.eu; upgrade-insecure-requests">
	<title>MOSTLAND</title>
	<link rel="stylesheet" href="pay.css">
</head>
<body>
	<main class="sheet">
		<p class="kicker">MOSTLAND</p>
		<h1>Донат</h1>
		<p class="lead" id="lead">Секунду…</p>
		<section class="code-block" hidden id="codeBlock">
			<p class="label">В комментарий к платежу</p>
			<p class="code" id="codeText"></p>
			<button type="button" id="copyBtn">Скопировать</button>
		</section>
		<section class="pack" hidden id="packBlock">
			<p id="packTitle"></p>
			<p class="sum" id="packSum"></p>
		</section>
		<p class="warn" id="warn" hidden></p>
		<iframe id="payFrame" title="оплата" hidden sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe>
		<p class="foot">Касса DonatePay. Ник в комментарий не пиши.</p>
	</main>
	<script src="pay.js"></script>
</body>
</html>
